services:
  growth-ai-website:
    container_name: growth-ai-website
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
      - /tmp:size=8m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.http.routers.growth-ai-website.rule=Host(`g-aura.growthlabs.pt`)
      - traefik.http.routers.growth-ai-website.entrypoints=web
      - traefik.http.routers.growth-ai-website.priority=100
      - traefik.http.services.growth-ai-website.loadbalancer.server.port=8080

networks:
  web:
    external: true
